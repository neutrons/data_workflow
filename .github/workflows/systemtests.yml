name: Systemtests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [next, qa, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        environments: test
    - name: Build test data and SSL certificates
      run: |
        pixi run -e test test-data
        pixi run -e test ssl
    - name: Stand up docker containers
      run: docker compose up --build --wait --wait-timeout 300
      env:
          DJANGO_SETTINGS_MODULE: reporting.reporting_app.settings.envtest
          LDAP_SERVER_URI: .
          LDAP_DOMAIN_COMPONENT: .
    - name: Wait for everything to start up
      run: sleep 66
    - name: Test with pytest
      run: pixi run -e test systemtests
    - name: Capture container logs on failure
      if: failure()
      run: docker compose logs webmon dasmon workflow 2>&1 || true
    - name: Stand down docker containers
      run: docker compose down
